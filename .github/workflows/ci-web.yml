name: ci-web
on:
  pull_request:
    paths:
      - "src/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "tsconfig*.json"
      - ".eslintrc*"
      - "eslint.config.*"
      - "vite.config.*"
      - "playwright.config.*"
      - "tests/e2e/**"
      - "AGENTS.md"
      - ".agent/**"
      - ".codex/**"
      - "docs/codex-prompts.md"
      - "docs/plans/sprint-4/**"
      - "README.md"
      - "CODEOWNERS"
      - ".github/workflows/ci-web.yml"
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm tsc --noEmit

      - name: ESLint
        run: pnpm eslint .

      - name: Vite build
        run: pnpm build

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Browser smoke
        run: pnpm test:e2e
